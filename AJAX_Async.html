<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAXAdvance JS</title>

<script>
    //  AJAX means Asynchronous JavaScript And XML. It is a technique that uses a combination of:
    //  - A browser built-in XMLHttpRequest object (to request data from a web server)
    //  - JavaScript and HTML DOM (to display or use the data)


//  This is old way. It is not recommended to use. latest version is fetch API.
function loadDoc() {
    let xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            document.getElementById("demo").innerHTML = this.responseText;
        }
    };
    xhttp.open("GET", "readme.txt", true);
    xhttp.send();
}
</script>

</head>
<body>
<div id="demo">
    <h1>Let AJAX change this text</h1>
    <button type="button" onclick="loadDoc()">Click ME</button>
</div>

</body>
</html>
